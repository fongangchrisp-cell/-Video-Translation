name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libpulse0 \
            libxcb-cursor0 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (includes headless GUI and real FFmpeg subtitle rendering)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
