[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliptranslate-pilot"
version = "0.1.0"
description = "A local desktop pilot for French-to-English subtitles on short videos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "faster-whisper>=1.1,<2",
    "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "ruff>=0.6"]

[project.scripts]
cliptranslate = "cliptranslate.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF", "PERF"]
ignore = ["PERF203"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui_smoke.py" = ["E402"]  # Qt must be configured before the GUI is imported
